<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0F"/>
      <stop offset="100%" stop-color="#24121A"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="16" fill="url(#bg)"/>
  
  <text x="550" y="38" fill="#FF6A88" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">APEXGUILD ENTERPRISE RBAC &amp; FINITE STATE MACHINE PIPELINE</text>
  <text x="550" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Multi-Tier Approval State Machine Guarded by Role Permission Thresholds &amp; Cryptographic Audit Logs</text>

  <!-- Step 1: Requester -->
  <g transform="translate(50, 110)">
    <rect width="200" height="180" rx="10" fill="#2D1520" stroke="#FF9A8B" stroke-width="1.5"/>
    <text x="100" y="30" fill="#FF9A8B" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. REQUESTER</text>
    <rect x="20" y="50" width="160" height="28" rx="6" fill="#3D1D2B"/>
    <text x="100" y="69" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">JSON Dynamic Form</text>
    <text x="100" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Submits PO / Request</text>
    <rect x="25" y="135" width="150" height="32" rx="6" fill="#FF9A8B" opacity="0.2"/>
    <text x="100" y="156" fill="#FF9A8B" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">State: DRAFT</text>
  </g>

  <path d="M 260 200 L 310 200" stroke="#FF6A88" stroke-width="2.5"/>
  <polygon points="315,200 305,195 305,205" fill="#FF6A88"/>

  <!-- Step 2: Line Manager -->
  <g transform="translate(320, 110)">
    <rect width="200" height="180" rx="10" fill="#2D1520" stroke="#FF6A88" stroke-width="1.5"/>
    <text x="100" y="30" fill="#FF6A88" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. LINE MANAGER</text>
    <rect x="20" y="50" width="160" height="28" rx="6" fill="#3D1D2B"/>
    <text x="100" y="69" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Approval Limit: $1,000</text>
    <text x="100" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">First-Line Policy Check</text>
    <rect x="25" y="135" width="150" height="32" rx="6" fill="#FF6A88" opacity="0.2"/>
    <text x="100" y="156" fill="#FF6A88" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">State: IN_REVIEW</text>
  </g>

  <path d="M 530 200 L 580 200" stroke="#FF6A88" stroke-width="2.5"/>
  <polygon points="585,200 575,195 575,205" fill="#FF6A88"/>

  <!-- Step 3: Corporate CFO -->
  <g transform="translate(590, 110)">
    <rect width="200" height="180" rx="10" fill="#2D1520" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="100" y="30" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. CORPORATE CFO</text>
    <rect x="20" y="50" width="160" height="28" rx="6" fill="#3D1D2B"/>
    <text x="100" y="69" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Approval Limit: $10,000</text>
    <text x="100" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Budget &amp; Fiscal Audit</text>
    <rect x="25" y="135" width="150" height="32" rx="6" fill="#F43F5E" opacity="0.2"/>
    <text x="100" y="156" fill="#F43F5E" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">State: CFO_PASSED</text>
  </g>

  <path d="M 800 200 L 850 200" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="855,200 845,195 845,205" fill="#10B981"/>

  <!-- Step 4: Admin Final -->
  <g transform="translate(860, 110)">
    <rect width="190" height="180" rx="10" fill="#2D1520" stroke="#10B981" stroke-width="2"/>
    <text x="95" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. ADMIN SIGN-OFF</text>
    <rect x="15" y="50" width="160" height="28" rx="6" fill="#3D1D2B"/>
    <text x="95" y="69" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Digital Signature</text>
    <text x="95" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Webhook Dispatch</text>
    <rect x="20" y="135" width="150" height="32" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="95" y="156" fill="#10B981" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">State: APPROVED</text>
  </g>

  <!-- Rejection Path & Audit Logging -->
  <g transform="translate(50, 330)">
    <rect width="1000" height="110" rx="10" fill="#1B0C14" stroke="#3D1D2B"/>
    <text x="30" y="32" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⚠️ FSM REJECTION BRANCH &amp; CRYPTOGRAPHIC AUDITING:</text>
    <text x="30" y="55" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">If any tier rejects, request transitions immediately to [REJECTED] state requiring mandatory justification notes.</text>
    <text x="30" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">All actions record user ID, timestamp, and immutable SHA-256 digital signature in SQLite: audit_logs (id, request_id, action, signature_hash).</text>
  </g>
</svg>